# Derived contract for broadcasts. Do not hand-edit the shape. It is projected from:
#   fields + constraints  ← data-model.md (broadcasts, broadcast_audience_tags, broadcast_group_contacts,
#                           broadcast_recipients, contact_bot_reach, broadcast_items) + the existing schema
#                           (contacts, contact_tags / tags for the audience, memberships for display names,
#                           bots.state for launch readiness)
#   error responses       ← sad.md §6 seeded flows 1–4 and flows 5–19 (one response per alt-branch)
#   endpoint list + shape ← spec.md §4 user stories / §5 acceptance criteria
# Field origins and the drift check are in api-sync-report.md next to this file. The live frames
# (broadcast.changed, contact.changed reach, conversation.changed broadcast), the realtime signals, the
# pg-boss jobs and the inbound my_chat_member update are in events.md.
#
# THIS IS A DELTA over the shipped contracts:
#   - shared-inbox (../../shared-inbox/contracts/openapi.yaml): the guard responses, ErrorEnvelope, Cursor,
#     MemberRef, WorkspaceId / ConversationId / BackgroundRequest parameters, ItemNotFound;
#   - assignment-statuses (../../assignment-statuses/contracts/openapi.yaml): ThreadPage / ThreadItem /
#     ThreadActivity, the current listThreadItems;
#   - contacts (../../contacts/contracts/openapi.yaml): listContacts / getContact, ContactRow,
#     ContactProfile, TagRef, TagName, TagFilterMode, TagNotFoundError;
#   - operator-notifications (../../operator-notifications/contracts/openapi.yaml): the current live socket;
#   - bot-connection (../../bot-connection/contracts/openapi.yaml): receiveTelegramUpdate, TelegramUpdate.
#   Every operation and schema here carries `x-delta: added` or `x-delta: changed`. An operation or schema
#   not listed here is unchanged and stays defined in its original contract. Unchanged pieces are external
#   $refs, never copies.
#
# Deviations from the api-skill defaults are the repo's, recorded in api-sync-report.md:
#   - auth: the opaque session cookie (workspace-operators ADR-0002), not a bearer token
#   - paths: /api/... with no /v1 segment (workspace-operators ADR-0003, ADR-0004)
#   - methods: GET reads and action POSTs only (the repo's style)
#   - error envelope: the repo's { "error": { code, message, details? } } with UPPER_SNAKE codes
#     (CLAUDE.md, packages/shared/src/errors.ts)
#   - no Idempotency-Key header: every write is idempotent by state under the broadcast row lock (a second
#     launch answers `already_launched`, a second stop `unchanged`, a repeated add `unchanged`, a repeated
#     remove `unchanged`); the one async actor (the broadcasts.send chain) is enqueued inside the launch
#     transaction, so a retried launch can never enqueue twice
openapi: 3.1.0

info:
  title: broadcasts API (delta over shared-inbox, assignment-statuses, contacts, operator-notifications, bot-connection)
  version: 0.1.0
  description: |
    Lets a workspace send one plain-text message from its own business bot to a chosen part of its contact
    base, without leaving the panel (spec §1, §2). Pilots hold a tagged contact base that was pitched as
    "your broadcast base in the making"; this is the step that uses it. The sharpest failure is that
    broadcasts and support share **one bot**, so a broadcast must never take replies down with it, never
    send twice and never send what the owner did not confirm.

    - **Broadcasts list** (US-01, US-04): `GET …/broadcasts`, drafts and launched broadcasts together, the
      most recently changed first.
    - **Drafts** (US-01, US-02): any member creates a draft, saves its name and text and its audience
      against the version shown, fills a broadcast group from the Contacts search and filter, and deletes
      their own drafts (a business owner deletes any draft). Every draft read carries the count breakdown
      for the current bot.
    - **Launch** (US-03): a business owner reads the launch confirmation (also the pre-check) and launches
      against its version and audience fingerprint. At most 10 launches per workspace in 24 hours.
    - **Delivery report** (US-04): the launched broadcast with totals by outcome, recipients 50 at a time
      in position order, narrowable to one outcome; a business owner stops a sending broadcast.
    - **Duplicate** (US-05): any broadcast into a new draft, with a choice of audience for a launched one.
    - **Blocked the bot** (US-06): Contacts rows and the profile gain `blocked_since` for the current bot.
    - **Broadcast items** (US-07): the inbox thread gains the item type `broadcast`.

    Every route sits behind the workspace-access guard: a caller who was never a member gets
    `404 NOT_FOUND` with no hint, a deactivated member `403 ACCESS_REMOVED`, a signed-out caller
    `401 UNAUTHENTICATED` (AC-08). A broadcast, contact or tag id is always looked up together with the
    workspace id, so a foreign id is not found, and the composite foreign keys make a cross-workspace
    group row, recipient or item impossible. Names and the broadcast text are shown as plain text only
    (spec §6.1). Only `bots` talks to Telegram; no route here calls it synchronously.

servers:
  - url: /
    description: Same origin as the web panel (workspace-operators ADR-0004)

security:
  - SessionCookie: []

tags:
  - name: broadcasts
    description: Module `broadcasts` (ADR-0001). Owns broadcasts, audience tags, group rows and recipients; `registerBroadcasts` under `/api/workspaces/:workspaceId/broadcasts…`. Reaches `contacts`, `conversations`, `bots` and `workspaces` through their app layers
  - name: contacts
    description: Module `contacts`. The list and profile reads gain the blocked mark for the current bot (ADR-0002)
  - name: inbox
    description: Module `inbox`. The thread gains broadcast items, enriched from `broadcasts.itemDetails` (ADR-0010), and the live socket carries `broadcast.changed`
  - name: bots
    description: Module `bots`. The webhook now also receives `my_chat_member` (ADR-0003)

paths:
  # ───────────────────────── added operations: broadcasts ─────────────────────────
  /api/workspaces/{workspaceId}/broadcasts:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
    get:
      x-delta: added
      tags: [broadcasts]
      summary: List every broadcast of the workspace, drafts and launched together, the most recently changed first (US-01, US-04)
      description: |
        Flow 5 (AC-01, AC-08). Both roles get the same list. Read by
        `broadcasts_workspace_id_last_changed_at_idx` (`last_changed_at DESC, id DESC`). **Not paged**
        (ux-flows assumption): a pilot workspace holds tens of broadcasts, and at most 10 are launched per
        day. Each row carries its audience size: a draft's is computed on this read (a group counts its
        rows, a tag audience runs the Contacts filter count), a launched one's is the frozen
        `audience_size`. Re-read after every `broadcast.changed` frame (events.md), so statuses change live.
        An empty list is the panel's "what a broadcast is" state with "New broadcast" for every member.
      operationId: listBroadcasts
      parameters:
        - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/BackgroundRequest"
      responses:
        "200":
          description: Every broadcast of the workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastList" }
              examples:
                withBroadcasts:
                  summary: A draft and a sending broadcast (AC-01)
                  value:
                    workspace_id: "01920000-0000-7000-8000-000000000001"
                    items:
                      - id: "01920000-0000-7000-8000-000000000502"
                        name: "Test broadcast 2"
                        status: draft
                        audience_kind: tags
                        audience_size: 38
                        author: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                        last_changed_by: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                        last_changed_at: "2026-10-23T09:12:00Z"
                        launched_at: null
                        ended_at: null
                      - id: "01920000-0000-7000-8000-000000000501"
                        name: "Test broadcast 1"
                        status: sending
                        audience_kind: tags
                        audience_size: 38
                        author: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                        last_changed_by: { account_id: "01920000-0000-7000-8000-0000000000b1", display_name: "Test User" }
                        last_changed_at: "2026-10-23T09:00:00Z"
                        launched_at: "2026-10-23T09:00:00Z"
                        ended_at: null
                empty:
                  summary: No broadcast yet
                  value:
                    workspace_id: "01920000-0000-7000-8000-000000000001"
                    items: []
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/WorkspaceNotFound" }

    post:
      x-delta: added
      tags: [broadcasts]
      summary: Create a draft at its first valid name (US-01)
      description: |
        Flow 6 (AC-01, AC-02, AC-10). The panel calls this at the first valid name typed in the empty
        editor; leaving an editor that never had a valid name creates nothing. The server tidies and
        measures with the shared rule (`packages/shared/src/broadcast-text.ts`, ADR-0012): the name 1–80
        graphemes, the text trimmed at both ends and, when given, 1–4096 UTF-16 code units. An absent
        `text` starts the draft with an empty text (data-model assumption 3); the launch refuses an empty
        text later.

        The draft starts at `version` 1, `audience_kind` `tags`, `tag_mode` `any` with no tag (every
        contact), with the caller as author and last changer. Needs no bot. Publishes
        `broadcast.changed { change: draft }` in the same transaction. Nothing is sent.
      operationId: createBroadcast
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BroadcastCreate" }
            example:
              name: "Test broadcast 1"
      responses:
        "201":
          description: The new draft with its breakdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastDraft" }
              example:
                id: "01920000-0000-7000-8000-000000000503"
                workspace_id: "01920000-0000-7000-8000-000000000001"
                status: draft
                version: 1
                name: "Test broadcast 1"
                text: ""
                author: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                last_changed_by: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                last_changed_at: "2026-10-23T09:20:00Z"
                created_at: "2026-10-23T09:20:00Z"
                audience: { kind: tags, mode: any, tags: [], dropped_tags: [] }
                breakdown:
                  audience_size: 120
                  reach: { blocked_count: 2, never_wrote_count: 0, reachable_count: 118 }
        "400":
          description: The body does not match the schema (`VALIDATION_ERROR`), or the tidied name or text breaks the shared rule (`BROADCAST_NAME_INVALID`, `BROADCAST_TEXT_INVALID`, AC-02). Nothing is created
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/BroadcastNameInvalidError" }
                  - { $ref: "#/components/schemas/BroadcastTextInvalidError" }
                  - { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
              examples:
                nameTooLong:
                  value:
                    error: { code: BROADCAST_NAME_INVALID, message: "A name must be 1 to 80 characters", details: { field: name, min_length: 1, max_length: 80 } }
                textTooLong:
                  value:
                    error: { code: BROADCAST_TEXT_INVALID, message: "The text must be 1 to 4096 characters as Telegram counts them", details: { field: text, min_length: 1, max_length: 4096, length: 4101 } }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/WorkspaceNotFound" }

  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    get:
      x-delta: added
      tags: [broadcasts]
      summary: Read one broadcast — the draft with its breakdown, or the launched broadcast with its report totals (US-01, US-03, US-04)
      description: |
        Flows 7 and 11 (AC-01, AC-05, AC-08, AC-09, AC-10, AC-11, AC-14, AC-18). One address, two views:
        the answer's `status` picks the draft editor (SCR-25, `draft`) or the read-only broadcast page
        (SCR-28, `sending` / `sent` / `stopped`). A foreign or unknown id is `404` with no hint (SCR-06).

        **Draft.** The current fields and `version`, and the audience: a tag audience lists its stored
        tags that still exist under their **current** names (a rename keeps working) and, in
        `dropped_tags`, the ones deleted or merged away under the name they had when chosen (the notice,
        AC-01); a group gives its size. `breakdown` is computed on every read (not cached, not pushed,
        ux-flows) by `contacts.audienceBreakdown` for the **current** Telegram bot (ADR-0002, ADR-0004):
        audience size, then blocked, then never wrote to the current bot, then reachable. With no bot row
        at all `reach` is null and only the size is shown ("reach is known once a bot is connected"); a
        bot that is not working still has its Telegram bot id, so its breakdown is computed (sad.md §6
        assumption). An `audience_size` above 10 000 is saved but cannot be launched (AC-05).

        **Launched.** Name, text and the audience as it was defined at launch (tag names at launch), who
        launched it and when, the breakdown frozen at launch, who stopped it and when, the finish time and
        end reason, and `totals` — one grouped count over its recipient rows by state
        (`broadcast_recipients_state_position_idx`). The page re-reads this and its current recipient page
        after each `broadcast.changed` frame (events.md), one fetch at a time.
      operationId: getBroadcast
      parameters:
        - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/BackgroundRequest"
      responses:
        "200":
          description: The broadcast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Broadcast" }
              examples:
                draftTagAudience:
                  summary: A tag audience with a dropped tag — 38 match, 2 blocked, 36 reachable (AC-01)
                  value:
                    id: "01920000-0000-7000-8000-000000000502"
                    workspace_id: "01920000-0000-7000-8000-000000000001"
                    status: draft
                    version: 4
                    name: "Test broadcast 2"
                    text: "New prices from Monday."
                    author: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                    last_changed_by: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                    last_changed_at: "2026-10-23T09:12:00Z"
                    created_at: "2026-10-23T09:05:00Z"
                    audience:
                      kind: tags
                      mode: any
                      tags:
                        - { tag_id: "01920000-0000-7000-8000-000000000302", name: "VIP", kind: include }
                        - { tag_id: "01920000-0000-7000-8000-000000000303", name: "Staff", kind: exclude }
                      dropped_tags:
                        - { tag_id: "01920000-0000-7000-8000-000000000399", name: "Test tag", kind: include }
                    breakdown:
                      audience_size: 38
                      reach: { blocked_count: 2, never_wrote_count: 0, reachable_count: 36 }
                draftGroupNoBot:
                  summary: A broadcast group in a workspace with no bot — size only
                  value:
                    id: "01920000-0000-7000-8000-000000000504"
                    workspace_id: "01920000-0000-7000-8000-000000000001"
                    status: draft
                    version: 2
                    name: "Test broadcast 4"
                    text: "Hello"
                    author: { account_id: "01920000-0000-7000-8000-0000000000b1", display_name: "Test User" }
                    last_changed_by: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                    last_changed_at: "2026-10-23T09:30:00Z"
                    created_at: "2026-10-23T09:25:00Z"
                    audience: { kind: group, size: 14 }
                    breakdown: { audience_size: 14, reach: null }
                sending:
                  summary: A sending broadcast with its totals (AC-11)
                  value:
                    id: "01920000-0000-7000-8000-000000000501"
                    workspace_id: "01920000-0000-7000-8000-000000000001"
                    status: sending
                    name: "Test broadcast 1"
                    text: "New prices from Monday."
                    author: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                    last_changed_by: { account_id: "01920000-0000-7000-8000-0000000000b1", display_name: "Test User" }
                    last_changed_at: "2026-10-23T09:00:00Z"
                    created_at: "2026-10-22T16:00:00Z"
                    audience:
                      kind: tags
                      mode: any
                      tags:
                        - { tag_id: "01920000-0000-7000-8000-000000000302", name: "VIP", kind: include }
                        - { tag_id: "01920000-0000-7000-8000-000000000303", name: "Staff", kind: exclude }
                    launched_by: { account_id: "01920000-0000-7000-8000-0000000000b1", display_name: "Test User" }
                    launched_at: "2026-10-23T09:00:00Z"
                    launch_breakdown: { audience_size: 38, blocked_count: 2, never_wrote_count: 0, recipient_count: 36 }
                    stopped_by: null
                    stopped_at: null
                    ended_at: null
                    end_reason: null
                    totals: { waiting: 20, sending: 2, delivered: 12, blocked: 1, failed: 1, not_confirmed: 0, stopped: 0 }
                    not_reached_count: 0
        "400": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/ValidationFailed" }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404": { $ref: "#/components/responses/BroadcastNotFound" }

  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/save:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    post:
      x-delta: added
      tags: [broadcasts]
      summary: Save the draft's name and/or text against the version shown (US-01)
      description: |
        Flow 6 (AC-02, AC-03, AC-09, AC-10; ADR-0005). The editor saves as the member types (no separate
        save step), each save carrying the `expected_version` it was shown. The server tidies and
        measures with the shared rule first (ADR-0012): an invalid value is refused and the draft keeps
        its last valid content. Then, under the broadcast row lock (`FOR NO KEY UPDATE`):
        - not a broadcast of this workspace → `404` with no hint;
        - launched → `409 BROADCAST_NOT_A_DRAFT` (the panel shows the read-only page with Duplicate, AC-09);
        - another version → `409 BROADCAST_DRAFT_CHANGED` with the current draft; the editor shows the
          teammate's version next to the member's own edit to apply again (AC-03);
        - the version shown → the fields are written, `version` + 1, last changed by the caller, and
          `broadcast.changed { change: draft }` is published in the same transaction.
        A save whose tidied values equal the stored ones still raises the version (the panel never sends
        one). Group adds and removes never raise the version, so they never make this save stale.
      operationId: saveBroadcastFields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BroadcastFieldsSave" }
            example:
              expected_version: 3
              text: "New prices from Monday."
      responses:
        "200":
          description: The draft with its new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastDraft" }
              example:
                id: "01920000-0000-7000-8000-000000000502"
                workspace_id: "01920000-0000-7000-8000-000000000001"
                status: draft
                version: 4
                name: "Test broadcast 2"
                text: "New prices from Monday."
                author: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                last_changed_by: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                last_changed_at: "2026-10-23T09:12:00Z"
                created_at: "2026-10-23T09:05:00Z"
                audience:
                  kind: tags
                  mode: any
                  tags: [{ tag_id: "01920000-0000-7000-8000-000000000302", name: "VIP", kind: include }]
                  dropped_tags: []
                breakdown:
                  audience_size: 40
                  reach: { blocked_count: 2, never_wrote_count: 0, reachable_count: 38 }
        "400":
          description: Neither field given, a malformed body (`VALIDATION_ERROR`), or a value that breaks the shared rule (`BROADCAST_NAME_INVALID`, `BROADCAST_TEXT_INVALID`, AC-02). Nothing changes
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/BroadcastNameInvalidError" }
                  - { $ref: "#/components/schemas/BroadcastTextInvalidError" }
                  - { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
              examples:
                emptyText:
                  value:
                    error: { code: BROADCAST_TEXT_INVALID, message: "The text must be 1 to 4096 characters as Telegram counts them", details: { field: text, min_length: 1, max_length: 4096, length: 0 } }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404": { $ref: "#/components/responses/BroadcastNotFound" }
        "409": { $ref: "#/components/responses/DraftSaveConflict" }

  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/audience:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    post:
      x-delta: added
      tags: [broadcasts]
      summary: Save the draft's audience — a tag audience, or switch the kind — against the version shown (US-01, US-02)
      description: |
        Flow 7 (AC-01, AC-03, AC-05, AC-08; ADR-0004, ADR-0005). Checked under the broadcast row lock as
        `saveBroadcastFields` (`404`, `BROADCAST_NOT_A_DRAFT`, `BROADCAST_DRAFT_CHANGED`).

        **`kind: tags`** saves the whole tag audience: the match mode, the chosen tags and the tags to leave
        out. Every id is first resolved among this workspace's tags (`tags_workspace_id_id_key`): an id that
        does not resolve — deleted, merged away, or another workspace's — is `404 TAG_NOT_FOUND` naming it,
        and nothing is saved (flow 7: "refused as not found"). The draft's tag rows are replaced, each with
        `include` / `exclude` and the tag's name now; `version` + 1. `mode: none` takes no tags at all
        (neither chosen nor left out), and a tag cannot be both chosen and left out (`400
        VALIDATION_ERROR`). No chosen tag with `any` / `all` means every contact (AC-01). An audience that
        would match more than 10 000 contacts is saved; the draft read says it cannot be launched (AC-05).

        Switching **from a broadcast group** that holds contacts to a tag audience needs
        `expected_group_size`, the size the switch confirmation showed (SCR-32): a different current size
        is `409 BROADCAST_GROUP_CHANGED` with the current size, and the dialog asks again. Otherwise the
        group rows are deleted with the switch. An empty group needs no confirmation (`expected_group_size`
        0 or absent).

        **`kind: group`** switches a tag audience to an empty broadcast group: the tag rows are deleted,
        `version` + 1. Sent while the audience is already a group, it changes nothing and answers the
        draft unchanged (no version raise). Contacts are then added with the group routes.

        Publishes `broadcast.changed { change: draft }` when something was written.
      operationId: saveBroadcastAudience
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BroadcastAudienceSave" }
            examples:
              tagAudience:
                summary: Any of VIP, leaving out Staff (AC-01)
                value:
                  expected_version: 2
                  kind: tags
                  mode: any
                  tag_ids: ["01920000-0000-7000-8000-000000000302"]
                  exclude_tag_ids: ["01920000-0000-7000-8000-000000000303"]
              switchFromGroup:
                summary: Switch a group of 14 to a tag audience after the confirmation (SCR-32)
                value:
                  expected_version: 5
                  kind: tags
                  mode: any
                  tag_ids: []
                  exclude_tag_ids: []
                  expected_group_size: 14
              toGroup:
                value:
                  expected_version: 3
                  kind: group
      responses:
        "200":
          description: The draft with its audience, new version and breakdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastDraft" }
              example:
                id: "01920000-0000-7000-8000-000000000502"
                workspace_id: "01920000-0000-7000-8000-000000000001"
                status: draft
                version: 3
                name: "Test broadcast 2"
                text: "New prices from Monday."
                author: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                last_changed_by: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                last_changed_at: "2026-10-23T09:10:00Z"
                created_at: "2026-10-23T09:05:00Z"
                audience:
                  kind: tags
                  mode: any
                  tags:
                    - { tag_id: "01920000-0000-7000-8000-000000000302", name: "VIP", kind: include }
                    - { tag_id: "01920000-0000-7000-8000-000000000303", name: "Staff", kind: exclude }
                  dropped_tags: []
                breakdown:
                  audience_size: 38
                  reach: { blocked_count: 2, never_wrote_count: 0, reachable_count: 36 }
        "400":
          description: "A malformed body, more than 100 ids in a list, `mode: none` with tags, or a tag both chosen and left out. Nothing changes"
          content:
            application/json:
              schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
              examples:
                noneWithTags:
                  value:
                    error: { code: VALIDATION_ERROR, message: "\"No tags\" cannot be combined with chosen or left-out tags", details: { field: tag_ids } }
                bothWays:
                  value:
                    error: { code: VALIDATION_ERROR, message: "A tag cannot be both chosen and left out", details: { field: exclude_tag_ids } }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404":
          description: |
            `NOT_FOUND` — the workspace or the broadcast is unknown to the caller (no hint). `TAG_NOT_FOUND` —
            a named tag is not a tag of this workspace (deleted, merged away or foreign; no hint which).
            Nothing changes
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "../../contacts/contracts/openapi.yaml#/components/schemas/TagNotFoundError" }
                  - { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
              examples:
                tagGone:
                  value:
                    error: { code: TAG_NOT_FOUND, message: "This tag no longer exists", details: { tag_id: "01920000-0000-7000-8000-000000000399" } }
                broadcastNotFound:
                  value:
                    error: { code: NOT_FOUND, message: "Not found" }
        "409":
          description: |
            `BROADCAST_NOT_A_DRAFT` (launched meanwhile), `BROADCAST_DRAFT_CHANGED` (another version, with
            the current draft), or `BROADCAST_GROUP_CHANGED` (the group's size is no longer the one the
            switch confirmation showed, with the current size). Nothing changes
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/BroadcastNotADraftError" }
                  - { $ref: "#/components/schemas/BroadcastDraftChangedError" }
                  - { $ref: "#/components/schemas/BroadcastGroupChangedError" }
              examples:
                groupChanged:
                  value:
                    error: { code: BROADCAST_GROUP_CHANGED, message: "The group changed — it now holds 15 contacts", details: { group_size: 15 } }
                notADraft:
                  value:
                    error: { code: BROADCAST_NOT_A_DRAFT, message: "This broadcast was launched and can no longer be changed", details: { broadcast_id: "01920000-0000-7000-8000-000000000502", status: sending } }

  # ───────────────────────── added operations: the broadcast group ─────────────────────────
  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/group:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    get:
      x-delta: added
      tags: [broadcasts]
      summary: Read a page of the draft's broadcast group, the most recently added first (US-02)
      description: |
        Flow 8 (AC-04, AC-14). 50 contacts per page (no `limit` parameter), keyset by (`added_at`,
        `contact_id`) on `broadcast_group_contacts_added_at_idx`; `after` continues with older additions.
        Each row has the contact's name, username and tags (from `contacts.contactCards`, the Contacts row
        rules) and `blocked_since` for the **current** Telegram bot, so the group marks the contacts who
        blocked the bot; plus who added it and when. `size` is the group's row count. The breakdown is the
        draft's (`getBroadcast`), which the editor re-reads after every group change.

        A launched broadcast keeps its group rows read-only (data-model assumption 8) and answers them too;
        the recipient list (`listBroadcastRecipients`) is the truth for a launched group. A draft whose
        audience is a tag audience answers an empty page with `size: 0`.
      operationId: listBroadcastGroup
      parameters:
        - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/BackgroundRequest"
        - in: query
          name: after
          required: false
          description: The `next_cursor` of the previous page. It encodes (`added_at`, `contact_id`)
          schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/Cursor" }
      responses:
        "200":
          description: One page of the group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastGroupPage" }
              example:
                workspace_id: "01920000-0000-7000-8000-000000000001"
                broadcast_id: "01920000-0000-7000-8000-000000000504"
                size: 14
                items:
                  - contact:
                      id: "01920000-0000-7000-8000-0000000000a1"
                      first_name: "Test"
                      last_name: "User"
                      username: "test_user_1"
                      tags: [{ id: "01920000-0000-7000-8000-000000000304", name: "Wholesale" }]
                      blocked_since: "2026-10-20T11:00:00Z"
                    added_by: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                    added_at: "2026-10-23T09:31:00Z"
                has_prev: false
                has_next: false
                next_cursor: null
        "400": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/ValidationFailed" }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404": { $ref: "#/components/responses/BroadcastNotFound" }

  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/group/membership:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    get:
      x-delta: added
      tags: [broadcasts]
      summary: Which of these contacts (one picker page) are already in the group (US-02)
      description: |
        Flow 8 (AC-04, AC-05). The group picker (SCR-26) reads a page with the Contacts list's own route
        (`listContacts`, same search, filter and counts by construction) and then asks which of that
        page's contact ids are in the group, to mark them. At most 50 ids (one page). Ids that are not
        in the group — including ids of other workspaces — are simply absent from the answer, so it gives
        no hint. Read by `broadcast_group_contacts_pkey`.
      operationId: getBroadcastGroupMembership
      parameters:
        - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/BackgroundRequest"
        - in: query
          name: contact
          required: true
          description: "Contact ids of one picker page, repeated (`contact=<id>&contact=<id>`)"
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items: { type: string, format: uuid }
      responses:
        "200":
          description: The asked ids that are in the group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastGroupMembership" }
              example:
                broadcast_id: "01920000-0000-7000-8000-000000000504"
                contact_ids: ["01920000-0000-7000-8000-0000000000a1"]
        "400": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/ValidationFailed" }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404": { $ref: "#/components/responses/BroadcastNotFound" }

  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/group/contacts:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    post:
      x-delta: added
      tags: [broadcasts]
      summary: Add one contact to the draft's broadcast group (US-02)
      description: |
        Flow 8 "add one contact" (AC-03, AC-04, AC-05, AC-08; ADR-0005). Under the broadcast row lock
        (`FOR NO KEY UPDATE`): still a draft (`BROADCAST_NOT_A_DRAFT`), its audience still a group
        (`BROADCAST_DRAFT_CHANGED` with the current draft, when a teammate switched the kind meanwhile),
        the contact a contact of this workspace (`404` with no hint otherwise — the composite foreign key
        makes a foreign contact unstorable), already in the group (`200 unchanged`, "already there"), the
        group under 10 000 (`409 BROADCAST_AUDIENCE_TOO_LARGE` with `can_add: 0`). Otherwise one row is
        inserted (`ON CONFLICT DO NOTHING`) with the caller and the time; last changed by the caller;
        **the version stays**, so no teammate's name or text save goes stale (AC-03). Publishes
        `broadcast.changed { change: group }` when added.
      operationId: addBroadcastGroupContact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BroadcastGroupAdd" }
            example:
              contact_id: "01920000-0000-7000-8000-0000000000a1"
      responses:
        "200":
          description: Added, or already in the group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastGroupChange" }
              examples:
                added:
                  value: { broadcast_id: "01920000-0000-7000-8000-000000000504", outcome: added, group_size: 2 }
                alreadyThere:
                  value: { broadcast_id: "01920000-0000-7000-8000-000000000504", outcome: unchanged, group_size: 2 }
        "400": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/ValidationFailed" }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404":
          description: The workspace, the broadcast or the contact is unknown to the caller — or the contact belongs to another workspace. The cases cannot be told apart (AC-08)
          content:
            application/json:
              schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: NOT_FOUND, message: "Not found" }
        "409": { $ref: "#/components/responses/GroupWriteConflict" }

  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/group/contacts/{contactId}/remove:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
      - $ref: "../../contacts/contracts/openapi.yaml#/components/parameters/ContactId"
    post:
      x-delta: added
      tags: [broadcasts]
      summary: Remove one contact from the draft's broadcast group (US-02)
      description: |
        Flow 8 "remove a contact" (AC-03, AC-04). Under the broadcast row lock: still a draft
        (`BROADCAST_NOT_A_DRAFT`); then the row is deleted by its key. An absent row — never added, already
        removed by a teammate, a foreign contact, or a tag-audience draft — answers `200 unchanged`, so a
        remove gives no hint about foreign ids and two members' removes both stand. Changes nothing on the
        contact. The version stays. Publishes `broadcast.changed { change: group }` when removed.
      operationId: removeBroadcastGroupContact
      responses:
        "200":
          description: Removed, or not in the group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastGroupChange" }
              example: { broadcast_id: "01920000-0000-7000-8000-000000000504", outcome: removed, group_size: 13 }
        "400": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/ValidationFailed" }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404": { $ref: "#/components/responses/BroadcastNotFound" }
        "409":
          description: "`BROADCAST_NOT_A_DRAFT` — launched meanwhile. Nothing changes"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastNotADraftError" }
              example:
                error: { code: BROADCAST_NOT_A_DRAFT, message: "This broadcast was launched and can no longer be changed", details: { broadcast_id: "01920000-0000-7000-8000-000000000504", status: sending } }

  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/group/matching:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    get:
      x-delta: added
      tags: [broadcasts]
      summary: Count the contacts matching a search and filter that are not yet in the group — the first step of "add all matching" (US-02)
      description: |
        Flow 8 "add all matching", first step (AC-04, AC-05). Takes the Contacts list's `q`, `mode` and
        `tag` with the same rules (`contacts.matchingContactIds`, ADR-0004; `mode=none` with a `tag` is
        `400`, unresolved tag ids are left out and returned in `missing_tag_ids`). Answers how many match,
        how many of them the group already holds, how many it would add, and how many the group can still
        take under 10 000. The picker states `to_add_count` and asks to confirm; it shows the
        too-large refusal up front when `to_add_count` exceeds `can_add`. Writes nothing.
      operationId: countBroadcastGroupMatching
      parameters:
        - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/BackgroundRequest"
        - in: query
          name: q
          required: false
          description: As `listContacts.q`
          schema: { type: string, maxLength: 200 }
        - in: query
          name: mode
          required: false
          schema: { $ref: "../../contacts/contracts/openapi.yaml#/components/schemas/TagFilterMode" }
        - in: query
          name: tag
          required: false
          description: As `listContacts.tag`
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        "200":
          description: The counts for the confirmation step
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastGroupMatching" }
              example:
                broadcast_id: "01920000-0000-7000-8000-000000000504"
                matching_count: 14
                already_in_group_count: 1
                to_add_count: 13
                can_add: 9986
                missing_tag_ids: []
        "400":
          description: The query does not match the schema, or `mode=none` with a `tag` (as `listContacts`)
          content:
            application/json:
              schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: VALIDATION_ERROR, message: "\"No tags\" cannot be combined with chosen tags", details: { field: tag } }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404": { $ref: "#/components/responses/BroadcastNotFound" }

  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/group/add-matching:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    post:
      x-delta: added
      tags: [broadcasts]
      summary: Add every contact matching a search and filter now, as a whole or not at all (US-02)
      description: |
        Flow 8 "add all matching", on confirmation (AC-03, AC-04, AC-05). Under the broadcast row lock:
        still a draft, still a group (as `addBroadcastGroupContact`); then the matching contact ids **now**
        (up to the room left plus one) minus the group rows. If the group would pass 10 000 the whole add
        is refused (`409 BROADCAST_AUDIENCE_TOO_LARGE` with how many can still be added) and nothing is
        added. Otherwise every current match is inserted (`ON CONFLICT DO NOTHING`) with the caller and the
        time, the version stays, and `broadcast.changed { change: group }` is published when anything was
        added. `added_count` can differ from the `expected_count` the confirmation showed when the matches
        changed meanwhile; the picker then says how many were added (AC-04). Contacts that match later are
        never added.
      operationId: addBroadcastGroupMatching
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BroadcastGroupAddMatching" }
            example:
              q: "kyiv"
              mode: any
              tag_ids: ["01920000-0000-7000-8000-000000000304"]
              expected_count: 13
      responses:
        "200":
          description: The current matches were added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastGroupMatchingAdded" }
              examples:
                asCounted:
                  value: { broadcast_id: "01920000-0000-7000-8000-000000000504", expected_count: 13, added_count: 13, group_size: 14 }
                changedMeanwhile:
                  value: { broadcast_id: "01920000-0000-7000-8000-000000000504", expected_count: 13, added_count: 12, group_size: 13 }
        "400":
          description: "A malformed body, or `mode: none` with tags (as `listContacts`). Nothing changes"
          content:
            application/json:
              schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: VALIDATION_ERROR, message: "\"No tags\" cannot be combined with chosen tags", details: { field: tag_ids } }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404": { $ref: "#/components/responses/BroadcastNotFound" }
        "409": { $ref: "#/components/responses/GroupWriteConflict" }

  # ───────────────────────── added operations: delete, duplicate ─────────────────────────
  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/delete:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    post:
      x-delta: added
      tags: [broadcasts]
      summary: Delete a draft — its author or a business owner (US-01)
      description: |
        Flow 9 (AC-07, AC-08, AC-09). After the confirmation that names the draft and its audience size
        (SCR-31). A business owner's membership is share-locked first (`workspaces.lockActiveMembers`,
        SAD §8 lock order), then the broadcast row `FOR NO KEY UPDATE`:
        - not a broadcast of this workspace → `404` with no hint;
        - launched → `409 BROADCAST_NOT_A_DRAFT` (read-only, offer Duplicate, AC-09);
        - neither its author nor an active business owner → `403 FORBIDDEN` ("a draft is deleted by its
          author or a business owner", AC-07), whatever the browser showed;
        - otherwise its tag rows and group rows, then the broadcast row, are deleted, and
          `broadcast.changed { change: deleted }` is published; every open list drops it.
      operationId: deleteBroadcast
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastDeleted" }
              example: { workspace_id: "01920000-0000-7000-8000-000000000001", broadcast_id: "01920000-0000-7000-8000-000000000502" }
        "400": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/ValidationFailed" }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403":
          description: The membership is deactivated, or the caller is neither the draft's author nor a business owner. Nothing changes
          content:
            application/json:
              schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
              examples:
                accessRemoved:
                  value:
                    error: { code: ACCESS_REMOVED, message: "Your access to this workspace was removed" }
                notAuthor:
                  value:
                    error: { code: FORBIDDEN, message: "A draft is deleted by its author or a business owner" }
        "404": { $ref: "#/components/responses/BroadcastNotFound" }
        "409":
          description: "`BROADCAST_NOT_A_DRAFT` — a launched broadcast is never deleted (AC-09)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastNotADraftError" }
              example:
                error: { code: BROADCAST_NOT_A_DRAFT, message: "This broadcast was launched and can no longer be changed", details: { broadcast_id: "01920000-0000-7000-8000-000000000501", status: sent } }

  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/duplicate:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    post:
      x-delta: added
      tags: [broadcasts]
      summary: Duplicate any broadcast into a new draft (US-05)
      description: |
        Flow 15 (AC-07, AC-08, AC-13, AC-18). Any member, either role. One transaction: a new draft whose
        author and last changer are the caller, named "Copy of …" cut to 80 graphemes by the shared name
        rule, with the same text, `version` 1, plus a copy of the source's audience by `audience`:
        - `same` — only for a **draft** source (and its default): its tag rows or its group rows;
        - `same_tags` — only for a launched broadcast with a tag audience: the tags it was launched with
          (names at launch) as the copy's tag audience, evaluated again at the copy's launch;
        - `all_recipients` — a launched broadcast: a group of every recipient's contact; those who blocked
          the bot stay in it and count as unreachable in the breakdown;
        - `not_reached` — a launched broadcast **that has ended** (`sent` or `stopped`): a group of the
          recipients that failed with `bot_stopped`, `text_refused` or `telegram_error`, those `stopped`
          before their turn, and the `not_confirmed` ones only with `include_not_confirmed: true` (the
          dialog's warning, SCR-30). Delivered, blocked, `account_gone` and `chat_not_found` recipients are
          never copied. While the source still sends this is `409 BROADCAST_NOT_ENDED`.
        A choice that does not fit the source (`same` for a launched one, `same_tags` for a group,
        `all_recipients` / `not_reached` for a draft) is `400 VALIDATION_ERROR` with `details.field:
        audience`. Copied contacts pass the composite foreign keys to this workspace's contacts. The
        source never changes. Publishes `broadcast.changed { change: draft }` for the copy.
      operationId: duplicateBroadcast
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BroadcastDuplicate" }
            examples:
              draft:
                value: { audience: same }
              notReached:
                summary: Only recipients it did not reach, including not confirmed after the warning
                value: { audience: not_reached, include_not_confirmed: true }
      responses:
        "201":
          description: The new draft (the panel opens its editor, SCR-25)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastDraft" }
              example:
                id: "01920000-0000-7000-8000-000000000505"
                workspace_id: "01920000-0000-7000-8000-000000000001"
                status: draft
                version: 1
                name: "Copy of Test broadcast 1"
                text: "New prices from Monday."
                author: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                last_changed_by: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                last_changed_at: "2026-10-23T10:00:00Z"
                created_at: "2026-10-23T10:00:00Z"
                audience: { kind: group, size: 2 }
                breakdown:
                  audience_size: 2
                  reach: { blocked_count: 0, never_wrote_count: 0, reachable_count: 2 }
        "400":
          description: The audience choice does not fit the source, or a malformed body. Nothing is created
          content:
            application/json:
              schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: VALIDATION_ERROR, message: "\"Same tags\" needs a broadcast sent to a tag audience", details: { field: audience } }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404": { $ref: "#/components/responses/BroadcastNotFound" }
        "409":
          description: "`BROADCAST_NOT_ENDED` — \"only recipients it did not reach\" while the source still sends (AC-13). Nothing is created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastNotEndedError" }
              example:
                error: { code: BROADCAST_NOT_ENDED, message: "Available once the broadcast has ended", details: { broadcast_id: "01920000-0000-7000-8000-000000000501", status: sending } }

  # ───────────────────────── added operations: launch, stop, report ─────────────────────────
  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/launch-confirmation:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    get:
      x-delta: added
      tags: [broadcasts]
      summary: Read the launch confirmation — also the pre-check (US-03)
      description: |
        Flow 10 (AC-05, AC-06, AC-07, AC-09, AC-10; ADR-0006). "Launch" on the draft, and the
        launch-confirmation address, read this. It is the one pre-check: it answers either the
        confirmation or the refusal the draft shows, with the same codes as `launchBroadcast`, so the
        confirmation (SCR-27) never opens for a draft that cannot be launched. Business owners only
        (`403 OWNER_ONLY` for an operator — the panel lands them on the draft with the owners-only note).

        Checks, in the order the refusals are reported: a draft of this workspace (`404`; launched →
        `409 BROADCAST_NOT_A_DRAFT`, the panel goes to the broadcast page); a non-empty text
        (`400 BROADCAST_TEXT_INVALID`, data-model assumption 3); a working bot from
        `bots.launchReadiness` — state `connected` (`409 BROADCAST_NEEDS_WORKING_BOT` with the bot's state,
        and the way to Settings — Bot, SCR-08); the cap — fewer than 10 launches in the last 24 h
        (`429 BROADCAST_LAUNCH_LIMIT_REACHED` with `next_launch_at` = the 10th newest `launched_at` + 24 h,
        `broadcasts_workspace_id_launched_at_idx`); then the audience for that Telegram bot by
        `contacts.reachableContacts`: at most 10 000 (`409 BROADCAST_AUDIENCE_TOO_LARGE`) and at least
        one reachable (`409 BROADCAST_NO_REACHABLE_CONTACT`).

        The confirmation carries the trimmed text exactly as the customer will see it, the breakdown, the
        draft `version` and the audience `fingerprint` (SHA-256 over the sorted reachable contact ids). The
        launch sends both back. Writes nothing.
      operationId: getLaunchConfirmation
      parameters:
        - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/BackgroundRequest"
      responses:
        "200":
          description: The confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchConfirmation" }
              example:
                broadcast_id: "01920000-0000-7000-8000-000000000502"
                version: 4
                name: "Test broadcast 2"
                text: "New prices from Monday."
                breakdown: { audience_size: 38, blocked_count: 2, never_wrote_count: 0, recipient_count: 36 }
                fingerprint: "9f2c4b0e7d1a6c3f5e8b2d4a6c1e3f5a7b9d0c2e4f6a8b1c3d5e7f9a0b2c4d6e"
        "400": { $ref: "#/components/responses/LaunchTextInvalid" }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/BroadcastOwnerRouteForbidden" }
        "404": { $ref: "#/components/responses/BroadcastNotFound" }
        "409": { $ref: "#/components/responses/LaunchRefused" }
        "429": { $ref: "#/components/responses/LaunchLimitReached" }

  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/launch:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    post:
      x-delta: added
      tags: [broadcasts]
      summary: Launch the draft against the version and the audience fingerprint the confirmation showed (US-03)
      description: |
        Seeded flow 1, flow 10 (AC-05, AC-06, AC-07, AC-08, AC-09, AC-10; ADR-0006). One transaction, lock
        order memberships `FOR SHARE` → advisory `broadcast-launches:<ws>` → broadcast row
        `FOR NO KEY UPDATE`:
        1. the caller is an active business owner (`403 ACCESS_REMOVED` when deactivated meanwhile — nothing
           is launched; `403 OWNER_ONLY` for an operator — nothing is sent or changed, AC-07);
        2. the broadcast is a draft of this workspace (`404`); **already launched** — a double click or a
           second owner — answers `200` with `outcome: already_launched` and the launched broadcast, and
           launches nothing again (AC-06);
        3. the shown `expected_version` (`409 BROADCAST_DRAFT_CHANGED` with the current draft; the panel
           re-reads the confirmation to confirm again);
        4. then every check of `getLaunchConfirmation` again, with the same codes — text, bot, cap, size,
           at least one reachable;
        5. the reachable set's fingerprint equals `fingerprint` (`409 BROADCAST_AUDIENCE_CHANGED` with the
           current confirmation, even when the number is the same).
        Then it inserts the recipients in fingerprint order (positions 1…n, the contact's Telegram user
        id, `waiting`), freezes the text, the tag names at launch, the Telegram bot id and the confirmed
        breakdown, sets `sending`, `launched_by`, `launched_at`, enqueues the first `broadcasts.send` link
        and publishes `broadcast.changed { change: status }` — all in that transaction (events.md). A
        refused launch writes nothing and does not count toward the cap (AC-09).
      operationId: launchBroadcast
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BroadcastLaunch" }
            example:
              expected_version: 4
              fingerprint: "9f2c4b0e7d1a6c3f5e8b2d4a6c1e3f5a7b9d0c2e4f6a8b1c3d5e7f9a0b2c4d6e"
      responses:
        "200":
          description: Launched now, or already launched (nothing launched again). The panel opens the broadcast page (SCR-28)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastLaunched" }
              example:
                outcome: launched
                broadcast:
                  id: "01920000-0000-7000-8000-000000000502"
                  workspace_id: "01920000-0000-7000-8000-000000000001"
                  status: sending
                  name: "Test broadcast 2"
                  text: "New prices from Monday."
                  author: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                  last_changed_by: { account_id: "01920000-0000-7000-8000-0000000000b1", display_name: "Test User" }
                  last_changed_at: "2026-10-23T10:05:00Z"
                  created_at: "2026-10-23T09:05:00Z"
                  audience:
                    kind: tags
                    mode: any
                    tags:
                      - { tag_id: "01920000-0000-7000-8000-000000000302", name: "VIP", kind: include }
                      - { tag_id: "01920000-0000-7000-8000-000000000303", name: "Staff", kind: exclude }
                  launched_by: { account_id: "01920000-0000-7000-8000-0000000000b1", display_name: "Test User" }
                  launched_at: "2026-10-23T10:05:00Z"
                  launch_breakdown: { audience_size: 38, blocked_count: 2, never_wrote_count: 0, recipient_count: 36 }
                  stopped_by: null
                  stopped_at: null
                  ended_at: null
                  end_reason: null
                  totals: { waiting: 36, sending: 0, delivered: 0, blocked: 0, failed: 0, not_confirmed: 0, stopped: 0 }
                  not_reached_count: 0
        "400":
          description: A malformed body (`VALIDATION_ERROR`), or the draft's text is empty (`BROADCAST_TEXT_INVALID`). Nothing is launched
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/BroadcastTextInvalidError" }
                  - { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: BROADCAST_TEXT_INVALID, message: "Write the text before launching", details: { field: text, min_length: 1, max_length: 4096, length: 0 } }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/BroadcastOwnerRouteForbidden" }
        "404": { $ref: "#/components/responses/BroadcastNotFound" }
        "409":
          description: |
            Nothing is launched. `BROADCAST_DRAFT_CHANGED` (another version, with the current draft),
            `BROADCAST_AUDIENCE_CHANGED` (the reachable set differs from the fingerprinted one, with the
            current confirmation to confirm again), or the confirmation refusals:
            `BROADCAST_NEEDS_WORKING_BOT`, `BROADCAST_AUDIENCE_TOO_LARGE`, `BROADCAST_NO_REACHABLE_CONTACT`
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/BroadcastDraftChangedError" }
                  - { $ref: "#/components/schemas/BroadcastAudienceChangedError" }
                  - { $ref: "#/components/schemas/BroadcastNeedsWorkingBotError" }
                  - { $ref: "#/components/schemas/BroadcastAudienceTooLargeError" }
                  - { $ref: "#/components/schemas/BroadcastNoReachableContactError" }
              examples:
                audienceChanged:
                  summary: A contact was retagged since the confirmation — same number, different set (AC-06)
                  value:
                    error:
                      code: BROADCAST_AUDIENCE_CHANGED
                      message: "The contacts this broadcast would reach changed — check and confirm again"
                      details:
                        confirmation:
                          broadcast_id: "01920000-0000-7000-8000-000000000502"
                          version: 4
                          name: "Test broadcast 2"
                          text: "New prices from Monday."
                          breakdown: { audience_size: 38, blocked_count: 2, never_wrote_count: 0, recipient_count: 36 }
                          fingerprint: "0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9"
                needsBot:
                  value:
                    error: { code: BROADCAST_NEEDS_WORKING_BOT, message: "Launching needs a working bot", details: { bot_state: needs_token } }
        "429": { $ref: "#/components/responses/LaunchLimitReached" }

  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/stop:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    post:
      x-delta: added
      tags: [broadcasts]
      summary: Stop a sending broadcast — business owners only (US-04)
      description: |
        Seeded flow 4 (AC-18; ADR-0009). After the confirmation that says how many recipients are still
        waiting and that a stop cannot be undone (SCR-29); that number may be stale, and a stop needs no
        second confirmation. Memberships `FOR SHARE` (an active business owner: `403 ACCESS_REMOVED` /
        `403 OWNER_ONLY`), then the broadcast row `FOR NO KEY UPDATE`:
        - `sending` with waiting recipients → every `waiting` recipient becomes `stopped` ("not sent —
          stopped") and the broadcast `stopped` with `stopped_by`, `stopped_at`, `ended_at`, end reason
          `stopped`, in one transaction; `broadcast.changed { change: status }` is published. After this
          commit no send of it can start (a claim is a conditional single-row update); sends already in
          flight finish and record their outcome (spec §6: 0 sends started more than 2 s after the stop);
        - anything else — nothing waiting (only sends in flight, or it ended meanwhile), already stopped,
          or a draft — answers `200 unchanged` with the broadcast as it is; a broadcast that ends with
          its last outcome shows `sent` (AC-18 "a stop after every recipient has an outcome changes
          nothing").
      operationId: stopBroadcast
      responses:
        "200":
          description: Stopped now, or unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastStopped" }
              example:
                outcome: stopped
                broadcast:
                  id: "01920000-0000-7000-8000-000000000501"
                  workspace_id: "01920000-0000-7000-8000-000000000001"
                  status: stopped
                  name: "Test broadcast 1"
                  text: "New prices from Monday."
                  author: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                  last_changed_by: { account_id: "01920000-0000-7000-8000-0000000000b1", display_name: "Test User" }
                  last_changed_at: "2026-10-23T09:03:00Z"
                  created_at: "2026-10-22T16:00:00Z"
                  audience: { kind: group }
                  launched_by: { account_id: "01920000-0000-7000-8000-0000000000b1", display_name: "Test User" }
                  launched_at: "2026-10-23T09:00:00Z"
                  launch_breakdown: { audience_size: 3000, blocked_count: 0, never_wrote_count: 0, recipient_count: 3000 }
                  stopped_by: { account_id: "01920000-0000-7000-8000-0000000000b1", display_name: "Test User" }
                  stopped_at: "2026-10-23T09:03:00Z"
                  ended_at: "2026-10-23T09:03:00Z"
                  end_reason: stopped
                  totals: { waiting: 0, sending: 2, delivered: 1190, blocked: 6, failed: 2, not_confirmed: 0, stopped: 1800 }
                  not_reached_count: 1800
        "400": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/ValidationFailed" }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/BroadcastOwnerRouteForbidden" }
        "404": { $ref: "#/components/responses/BroadcastNotFound" }

  /api/workspaces/{workspaceId}/broadcasts/{broadcastId}/recipients:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/BroadcastId"
    get:
      x-delta: added
      tags: [broadcasts]
      summary: Read a page of a launched broadcast's recipients with their outcomes (US-04)
      description: |
        Flow 11 (AC-11, AC-12, AC-18; ADR-0011). 50 recipients per page (no `limit` parameter), in
        position order (the fingerprint's contact-id order, also the send order), keyset by `position` on
        `broadcast_recipients_broadcast_position_key`, or by (`state`, `position`) on
        `broadcast_recipients_state_position_idx` when narrowed to one `state`. Each row: the contact's
        name and username, the outcome, the plain failure reason, and the outcome time. Contact names come
        from `contacts.contactCards`. Picking a row opens the contact's profile (SCR-19). Re-read (the
        current page) after each `broadcast.changed { change: report | status }` frame. A draft has no
        recipients and answers an empty page.
      operationId: listBroadcastRecipients
      parameters:
        - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/BackgroundRequest"
        - in: query
