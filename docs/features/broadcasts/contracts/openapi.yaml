    ErrorCode:
      x-delta: changed
      x-delta-fields: [BROADCAST_NAME_INVALID, BROADCAST_TEXT_INVALID, BROADCAST_DRAFT_CHANGED, BROADCAST_GROUP_CHANGED, BROADCAST_NOT_A_DRAFT, BROADCAST_NOT_ENDED, BROADCAST_AUDIENCE_CHANGED, BROADCAST_AUDIENCE_TOO_LARGE, BROADCAST_NO_REACHABLE_CONTACT, BROADCAST_NEEDS_WORKING_BOT, BROADCAST_LAUNCH_LIMIT_REACHED]
      type: string
      description: |
        `ErrorCode` in packages/shared/src/errors.ts — the codes this delta uses.

        Existing: UNAUTHENTICATED 401, ACCESS_REMOVED 403, OWNER_ONLY 403, FORBIDDEN 403, NOT_FOUND 404,
        TAG_NOT_FOUND 404, VALIDATION_ERROR 400, UNSUPPORTED_MEDIA_TYPE 415, PAYLOAD_TOO_LARGE 413,
        INTERNAL_ERROR 500.

        Added by this feature (sad.md §8 Error handling; names fixed here):
        - BROADCAST_NAME_INVALID 400, BROADCAST_TEXT_INVALID 400 — `ValidationError`-class with their own
          codes (AC-02; the text code also refuses launching an empty draft text);
        - BROADCAST_DRAFT_CHANGED 409, BROADCAST_GROUP_CHANGED 409 — `ConflictError`-class (AC-03);
        - BROADCAST_NOT_A_DRAFT 409 — `ConflictError`-class (AC-09);
        - BROADCAST_NOT_ENDED 409 — `ConflictError`-class (AC-13; not in sad.md §8, flag F-2);
        - BROADCAST_AUDIENCE_CHANGED 409, BROADCAST_AUDIENCE_TOO_LARGE 409,
          BROADCAST_NO_REACHABLE_CONTACT 409, BROADCAST_NEEDS_WORKING_BOT 409 — `ConflictError`-class
          (AC-05, AC-06, AC-09, AC-10);
        - BROADCAST_LAUNCH_LIMIT_REACHED 429 — a `TooManyRequestsError`-class refusal with its own code,
          `next_launch_at` and `Retry-After` (AC-09).
      enum:
        - VALIDATION_ERROR
        - UNSUPPORTED_MEDIA_TYPE
        - PAYLOAD_TOO_LARGE
        - NOT_FOUND
        - FORBIDDEN
        - INTERNAL_ERROR
        - UNAUTHENTICATED
        - ACCESS_REMOVED
        - OWNER_ONLY
        - TAG_NOT_FOUND
        - BROADCAST_NAME_INVALID
        - BROADCAST_TEXT_INVALID
        - BROADCAST_DRAFT_CHANGED
        - BROADCAST_GROUP_CHANGED
        - BROADCAST_NOT_A_DRAFT
        - BROADCAST_NOT_ENDED
        - BROADCAST_AUDIENCE_CHANGED
        - BROADCAST_AUDIENCE_TOO_LARGE
        - BROADCAST_NO_REACHABLE_CONTACT
        - BROADCAST_NEEDS_WORKING_BOT
        - BROADCAST_LAUNCH_LIMIT_REACHED

