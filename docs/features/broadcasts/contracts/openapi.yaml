                    state: failed
                    failure_reason: account_gone
                    outcome_at: "2026-10-23T09:00:01Z"
                  - id: "01920000-0000-7000-8000-000000000603"
                    position: 3
                    contact: { id: "01920000-0000-7000-8000-0000000000a3", first_name: "Test User 3", last_name: null, username: "test_user_3" }
                    state: waiting
