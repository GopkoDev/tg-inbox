          schema: { $ref: "#/components/schemas/RecipientState" }
        - in: query
          name: after
          required: false
          description: The `next_cursor` of the previous page, issued for the same `state`. It encodes the last `position`
          schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/Cursor" }
      responses:
        "200":
          description: One page of recipients
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BroadcastRecipientPage" }
              example:
                workspace_id: "01920000-0000-7000-8000-000000000001"
