  /api/workspaces/{workspaceId}/contacts:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
    get:
      x-delta: changed
      x-delta-fields: ["response.items[].blocked_since"]
      tags: [contacts]
      summary: List the workspace's contacts — rows now carry the blocked mark for the current bot (US-06; also the group picker's read, US-02)
      description: |
        Flow 16, flow 8 (AC-04, AC-14). **Changed:** each row gains `blocked_since`, the time the contact
        blocked the workspace's **current** Telegram bot, or null (ADR-0002). The bot id comes from the
        `currentBot` port; the marks are read by `contact_bot_reach_pkey` for the listed page only. With
        no bot row every row answers null. Reconnecting the same Telegram bot keeps the marks; a
        different one starts clean (AC-10). Open lists re-read the affected row after a
        `contact.changed { change: reach }` frame (events.md).

        Everything else — `q`, `mode`, `tag`, `after`, order, 50 per page, counts, `missing_tag_ids`, the
        `400` / `401` / `403` / `404` answers — is unchanged (contacts `listContacts`). The group picker
        (SCR-26) uses this route as is, so its matching and counts are the Contacts list's by construction.
      operationId: listContacts
      parameters:
        - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/BackgroundRequest"
        - in: query
          name: q
          required: false
          schema: { type: string, maxLength: 200 }
        - in: query
          name: mode
          required: false
          schema: { $ref: "../../contacts/contracts/openapi.yaml#/components/schemas/TagFilterMode" }
        - in: query
          name: tag
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
        - in: query
          name: after
          required: false
          schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/Cursor" }
      responses:
        "200":
          description: One page of contacts with the counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactPage" }
              example:
                workspace_id: "01920000-0000-7000-8000-000000000001"
                filter: { q: null, mode: any, tag_ids: [] }
                items:
                  - id: "01920000-0000-7000-8000-0000000000a1"
                    workspace_id: "01920000-0000-7000-8000-000000000001"
                    first_name: "Test"
                    last_name: "User"
                    username: "test_user_1"
                    language_code: "uk"
                    first_wrote_at: "2026-09-02T08:14:00Z"
                    last_wrote_at: "2026-10-19T09:58:11Z"
                    tags: [{ id: "01920000-0000-7000-8000-000000000302", name: "VIP" }]
                    blocked_since: "2026-10-20T11:00:00Z"
                has_prev: false
                has_next: false
                next_cursor: null
                matching_count: 1
                total_count: 1
                missing_tag_ids: []
        "400": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/ValidationFailed" }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/WorkspaceNotFound" }

  /api/workspaces/{workspaceId}/contacts/{contactId}:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "../../contacts/contracts/openapi.yaml#/components/parameters/ContactId"
    get:
      x-delta: changed
      x-delta-fields: ["response.blocked_since"]
      tags: [contacts]
      summary: Read a contact's profile — now with "blocked the bot since …" for the current bot (US-06)
      description: |
        Flow 16 (AC-14). **Changed:** the profile gains `blocked_since` for the current Telegram bot, or
        null, as `ContactRow.blocked_since`. The profile shows "blocked the bot since <time>" while it is
        set, and re-reads after a `contact.changed { change: reach }` frame for this contact. Everything
        else is unchanged (contacts `getContact`).
      operationId: getContact
      parameters:
        - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/BackgroundRequest"
      responses:
        "200":
          description: The contact's profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactProfile" }
              example:
                id: "01920000-0000-7000-8000-0000000000a1"
                workspace_id: "01920000-0000-7000-8000-000000000001"
                first_name: "Test"
                last_name: "User"
                username: "test_user_1"
                language_code: "uk"
                first_wrote_at: "2026-09-02T08:14:00Z"
                last_wrote_at: "2026-10-19T09:58:11Z"
                tags: []
                blocked_since: "2026-10-20T11:00:00Z"
        "400": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/ValidationFailed" }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
        "404": { $ref: "../../contacts/contracts/openapi.yaml#/components/responses/ContactNotFound" }

  /api/workspaces/{workspaceId}/inbox/live:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
    get:
      x-delta: changed
      x-delta-fields: ["server → client frame broadcast.changed", "contact.changed change reach", "conversation.changed item.type broadcast"]
      tags: [inbox]
      summary: Open this tab's live socket — now also carrying broadcast.changed and two widened frames (US-04, US-06, US-07)
      description: |
        Flows 5, 11, 16, 18 (AC-01, AC-11, AC-14, AC-16; ADR-0011). The upgrade, the guard, the `Origin`
        check, the heartbeat, the re-check, the close codes, the `presence` client frame and every other
        frame are unchanged (shared-inbox, operator-notifications, contacts `openLiveSocket`).

        **Changed** (events.md), each to every socket of the workspace, ids only:
        - new `broadcast.changed { broadcast_id, change: draft | group | status | report | deleted }` —
          the list re-reads `listBroadcasts`; an open broadcast page re-reads `getBroadcast` and its
          current recipient page; `report` is coalesced to at most one per broadcast per second;
        - `contact.changed` gains `change: reach` — a contact's blocked mark for a bot changed;
        - `conversation.changed` gains `item.type: broadcast` (with `change: created` only).
      operationId: openLiveSocket
      parameters:
        - in: header
          name: Upgrade
          required: true
          schema: { type: string, const: websocket }
        - in: header
          name: Origin
          required: true
          description: Unchanged. Must equal the panel's origin
          schema: { type: string, maxLength: 2048 }
      responses:
        "101":
          description: Switching protocols. The socket carries the frames in events.md (shared-inbox, assignment-statuses, operator-notifications, contacts and this feature)
        "400": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/ValidationFailed" }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403":
          description: Unchanged — the membership is deactivated, or `Origin` is not the panel's origin
          content:
            application/json:
              schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
              examples:
                accessRemoved:
                  value:
                    error: { code: ACCESS_REMOVED, message: "Your access to this workspace was removed" }
                foreignOrigin:
                  value:
                    error: { code: FORBIDDEN, message: "Forbidden" }
        "404": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/WorkspaceNotFound" }

  /api/telegram/webhook/{botId}:
    parameters:
      - in: path
        name: botId
        required: true
        description: Unchanged (bot-connection `receiveTelegramUpdate`)
        schema: { type: string, maxLength: 64 }
    post:
      x-delta: changed
      x-delta-fields: ["request: my_chat_member updates of private chats"]
      tags: [bots]
      summary: Receive a Telegram update for one bot — now also a private my_chat_member (blocked / unblocked) (US-06)
      description: |
        Seeded flow 3, flow 16 (AC-14; ADR-0003). The secret check before the body is parsed, the `401`
        with an empty body, `500` with redelivery and every existing capture rule are unchanged
        (bot-connection `receiveTelegramUpdate`).

        **Changed:** the webhook's `allowed_updates` now names `my_chat_member`, and `bots` classifies a
        private-chat `my_chat_member` **before** the inbound interceptor and capture, never handing it to
        either. `new_chat_member.status` `kicked` records "blocked" and `member` records "unblocked" in
        `contacts.recordBlockChange` for (workspace, this bot's Telegram id, `from.id`), at the update's
        `date`, applied only when newer than the reach row's last fact. A user who is not a contact of the
        workspace (for example a member's own linked Telegram account) changes nothing. No message,
        conversation, unread, attention or ping results. `contact.changed { change: reach }` is published
        when a mark changed. Group, channel and other statuses are ignored with `200`. The answer is always
        `200` with an empty body for an authentic update, as before.

        The 3-minute health check re-registers a webhook whose `allowed_updates` lack `my_chat_member`
        (same URL and secret, pending updates kept), so bots connected before this feature start receiving
        block notices within minutes of the deploy (flow 17; no route).
      operationId: receiveTelegramUpdate
      security:
        - TelegramSecretToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramUpdate" }
            example:
              update_id: 900002
              my_chat_member:
                chat: { id: 700001, type: private, first_name: "Test User" }
                from: { id: 700001, is_bot: false, first_name: "Test User" }
                date: 1792310400
                old_chat_member: { status: member, user: { id: 900100, is_bot: true, first_name: "Test Bot" } }
                new_chat_member: { status: kicked, user: { id: 900100, is_bot: true, first_name: "Test Bot" }, until_date: 0 }
      responses:
        "200":
          description: Captured, applied, already present, or deliberately ignored. The body is empty
        "401":
          description: Unchanged — unknown bot id, a missing or mismatched secret, or a disconnected bot. Empty body
        "500":
          description: Unchanged — the handling failed. Telegram redelivers later
          content:
            application/json:
              schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
              example:
                error: { code: INTERNAL_ERROR, message: "Internal server error" }

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Restated only because a security requirement names a local scheme. Identical to the shared-inbox / workspace-operators scheme (workspace-operators ADR-0002)
    TelegramSecretToken:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Restated only because a security requirement names a local scheme. Identical to bot-connection's per-bot secret (checked before the body is parsed, only its hash stored, redacted from logs)

  parameters:
    BroadcastId:
      in: path
      name: broadcastId
      required: true
      description: "`broadcasts.id` (UUIDv7), always looked up together with the workspace id (`broadcasts_workspace_id_id_key`). A malformed id answers 400; an unknown, deleted or foreign id answers 404 with no hint"
      schema: { type: string, format: uuid }
    BroadcastItemId:
      in: path
      name: broadcastItemId
      required: true
      description: "`broadcast_items.id` (UUIDv7) — the live frame's item id. Looked up with the workspace and conversation ids"
      schema: { type: string, format: uuid }

  responses:
    BroadcastNotFound:
      description: The workspace is unknown to the caller, or there is no such broadcast in it — deleted, never existed, or a broadcast of another workspace. The cases cannot be told apart, so there is no hint (AC-08, SCR-06)
      content:
        application/json:
          schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
          example:
            error: { code: NOT_FOUND, message: "Not found" }
    DraftSaveConflict:
      description: |
        `BROADCAST_NOT_A_DRAFT` — launched meanwhile; the panel shows the read-only page with Duplicate
        (AC-09). `BROADCAST_DRAFT_CHANGED` — a teammate saved first; `details.draft` is the current draft,
        shown next to the member's own edit to apply again (AC-03). Nothing changes
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/BroadcastNotADraftError" }
              - { $ref: "#/components/schemas/BroadcastDraftChangedError" }
          examples:
            draftChanged:
              value:
                error:
                  code: BROADCAST_DRAFT_CHANGED
                  message: "A teammate changed this draft — check their version and apply your change again"
                  details:
                    draft:
                      id: "01920000-0000-7000-8000-000000000502"
                      workspace_id: "01920000-0000-7000-8000-000000000001"
                      status: draft
                      version: 4
                      name: "Test broadcast 2"
                      text: "New prices from Monday!"
                      author: { account_id: "01920000-0000-7000-8000-0000000000b2", display_name: "Test User 2" }
                      last_changed_by: { account_id: "01920000-0000-7000-8000-0000000000b1", display_name: "Test User" }
                      last_changed_at: "2026-10-23T09:11:00Z"
                      created_at: "2026-10-23T09:05:00Z"
                      audience: { kind: tags, mode: any, tags: [], dropped_tags: [] }
                      breakdown: { audience_size: 120, reach: { blocked_count: 2, never_wrote_count: 0, reachable_count: 118 } }
            notADraft:
              value:
                error: { code: BROADCAST_NOT_A_DRAFT, message: "This broadcast was launched and can no longer be changed", details: { broadcast_id: "01920000-0000-7000-8000-000000000502", status: sending } }
    GroupWriteConflict:
      description: |
        Nothing is added. `BROADCAST_NOT_A_DRAFT` — launched meanwhile. `BROADCAST_DRAFT_CHANGED` — a
        teammate switched the audience to a tag audience meanwhile (`details.draft` is the current draft).
        `BROADCAST_AUDIENCE_TOO_LARGE` — the group would pass 10 000 contacts, reachable or not; the add is
        refused as a whole and `details.can_add` says how many can still be added (AC-05)
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/BroadcastNotADraftError" }
              - { $ref: "#/components/schemas/BroadcastDraftChangedError" }
              - { $ref: "#/components/schemas/BroadcastAudienceTooLargeError" }
          examples:
            tooLarge:
              value:
                error: { code: BROADCAST_AUDIENCE_TOO_LARGE, message: "A broadcast's audience can hold at most 10 000 contacts — 10 more can be added", details: { limit: 10000, audience_size: 9990, can_add: 10 } }
    BroadcastOwnerRouteForbidden:
      description: The membership is deactivated (`ACCESS_REMOVED`; on a launch, nothing is launched, AC-08), or the caller is an operator and only business owners launch and stop broadcasts (`OWNER_ONLY`, AC-07, AC-18). Nothing is sent or changed. Same envelope as contacts `TagsOwnerRouteForbidden`
      content:
        application/json:
          schema: { $ref: "../../workspace-operators/contracts/openapi.yaml#/components/schemas/ErrorEnvelope" }
          examples:
            accessRemoved:
              value:
                error: { code: ACCESS_REMOVED, message: "Your access to this workspace was removed" }
            ownerOnly:
              value:
                error: { code: OWNER_ONLY, message: "Only a business owner launches and stops broadcasts" }
    LaunchTextInvalid:
      description: "`BROADCAST_TEXT_INVALID` — the draft has no text yet (data-model assumption 3); the editor says the text must be 1 to 4096 characters. Nothing is launched"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BroadcastTextInvalidError" }
          example:
            error: { code: BROADCAST_TEXT_INVALID, message: "Write the text before launching", details: { field: text, min_length: 1, max_length: 4096, length: 0 } }
    LaunchRefused:
      description: |
        The draft cannot be launched now (flow 10, shown on the draft; the confirmation does not open).
        `BROADCAST_NOT_A_DRAFT` — launched already (the panel opens the broadcast page).
        `BROADCAST_NEEDS_WORKING_BOT` — no bot, or a bot that is not `connected`, with the way to
        Settings — Bot (AC-10). `BROADCAST_AUDIENCE_TOO_LARGE` — over 10 000 (AC-05).
        `BROADCAST_NO_REACHABLE_CONTACT` — the audience has no reachable contact (AC-09)
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/BroadcastNotADraftError" }
              - { $ref: "#/components/schemas/BroadcastNeedsWorkingBotError" }
              - { $ref: "#/components/schemas/BroadcastAudienceTooLargeError" }
              - { $ref: "#/components/schemas/BroadcastNoReachableContactError" }
          examples:
            noBot:
              value:
                error: { code: BROADCAST_NEEDS_WORKING_BOT, message: "Launching needs a working bot — connect it in Settings — Bot", details: { bot_state: not_connected } }
            tooLarge:
              value:
                error: { code: BROADCAST_AUDIENCE_TOO_LARGE, message: "A broadcast's audience can hold at most 10 000 contacts", details: { limit: 10000, audience_size: 10420, can_add: 0 } }
            nobodyReachable:
              value:
                error: { code: BROADCAST_NO_REACHABLE_CONTACT, message: "This audience has no reachable contact", details: { breakdown: { audience_size: 3, blocked_count: 1, never_wrote_count: 2, recipient_count: 0 } } }
    LaunchLimitReached:
      description: |
        `BROADCAST_LAUNCH_LIMIT_REACHED` — the workspace launched 10 broadcasts within the last 24 hours,
        stopped and aborted ones included (AC-09; counted under `broadcast-launches:<ws>`). Nothing is
        launched; drafts stay editable. `details.next_launch_at` is the 10th newest `launched_at` + 24 h;
        `Retry-After` gives the same time in whole seconds
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1, maximum: 86400 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BroadcastLaunchLimitReachedError" }
          example:
            error:
              code: BROADCAST_LAUNCH_LIMIT_REACHED
              message: "A workspace can launch at most 10 broadcasts in 24 hours — the next launch is possible at 14:20"
              details: { limit: 10, window_hours: 24, next_launch_at: "2026-10-24T14:20:00Z" }

  schemas:
    # ───────── constants and names ─────────
    BroadcastName:
      x-delta: added
      type: string
      minLength: 1
      description: |
        `broadcasts.name` — internal, never sent. Tidied like a tag name and 1–80 graphemes (an emoji is
        one) by the shared rule (`packages/shared/src/broadcast-text.ts`, ADR-0012); JSON Schema counts code
        points, so no `maxLength` is stated. Shown as plain text only
    BroadcastText:
      x-delta: added
      type: string
      maxLength: 4096
      description: |
        `broadcasts.text` — trimmed at both ends; 1–4096 UTF-16 code units as Telegram counts them
        (ADR-0012). Empty only in a draft that has no text yet (data-model assumption 3). `maxLength`
        counts code points, which never exceed UTF-16 units, so it is a safe bound (data-model assumption 4).
        Sent and shown as plain text, no formatting (AC-17)
    RawBroadcastName:
      x-delta: added
      type: string
      maxLength: 1000
      description: The name as typed. The server tidies it and checks 1–80 graphemes (`BROADCAST_NAME_INVALID`); the bound only caps the request
    RawBroadcastText:
      x-delta: added
      type: string
      maxLength: 20000
      description: The text as typed. The server trims it and checks 1–4096 UTF-16 code units (`BROADCAST_TEXT_INVALID`); the bound only caps the request
    BroadcastStatus:
      x-delta: added
      type: string
      enum: [draft, sending, sent, stopped]
      description: "`broadcasts.status`. `sent` covers a finished broadcast and one ended early by a refused text or a lost bot (`end_reason`)"
    AudienceKind:
      x-delta: added
      type: string
      enum: [tags, group]
      description: "`broadcasts.audience_kind`"
    AudienceTagKind:
      x-delta: added
      type: string
      enum: [include, exclude]
      description: "`broadcast_audience_tags.kind` — chosen (with the match mode) or left out"
    EndReason:
      x-delta: added
      type: string
      enum: [completed, text_refused, bot_stopped, stopped]
      description: "`broadcasts.end_reason` (data-model assumption 9)"
    RecipientState:
      x-delta: added
      type: string
      enum: [waiting, sending, delivered, blocked, failed, not_confirmed, stopped]
      description: |
        `broadcast_recipients.state`. The panel's wording (spec AC-11, AC-18): `waiting` / `sending` —
        waiting; `delivered`; `blocked` — blocked the bot; `failed` — failed with its reason;
        `not_confirmed` — "not confirmed — Telegram did not answer, not sent again"; `stopped` — "not sent —
        stopped"
    RecipientFailureReason:
      x-delta: added
      type: string
      enum: [account_gone, chat_not_found, telegram_error, text_refused, bot_stopped]
      description: |
        `broadcast_recipients.failure_reason`, set exactly when `state` is `failed` (ADR-0009):
        `account_gone` — "account no longer exists"; `chat_not_found` — "chat not found"; `telegram_error` —
        "Telegram error"; `text_refused` — "Telegram refused the text"; `bot_stopped` — "the bot stopped
        working". "Only recipients it did not reach" copies `bot_stopped`, `text_refused` and
        `telegram_error` (AC-13)
    AudienceFingerprint:
      x-delta: added
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: SHA-256 (lowercase hex) over the sorted ids of the reachable contacts the confirmation counted (ADR-0006). Opaque to the panel, which sends it back unchanged

    # ───────── audience and breakdown ─────────
    AudienceTag:
      x-delta: added
      type: object
      required: [tag_id, name, kind]
      additionalProperties: false
      properties:
        tag_id: { type: string, format: uuid, description: "`broadcast_audience_tags.tag_id` — the tag's identity across renames" }
        name:
          $ref: "../../contacts/contracts/openapi.yaml#/components/schemas/TagName"
          description: In a draft's `tags`, the tag's **current** name; in `dropped_tags` and in a launched audience, `broadcast_audience_tags.tag_name` (the name when chosen, or at launch)
        kind: { $ref: "#/components/schemas/AudienceTagKind" }
    DraftTagAudience:
      x-delta: added
      type: object
      required: [kind, mode, tags, dropped_tags]
      additionalProperties: false
      properties:
        kind: { const: tags }
        mode: { $ref: "../../contacts/contracts/openapi.yaml#/components/schemas/TagFilterMode" }
        tags:
          type: array
          maxItems: 200
          description: The stored tags that still exist, chosen and left out, in tag-list order. No chosen tag with `any` / `all` means every contact
          items: { $ref: "#/components/schemas/AudienceTag" }
        dropped_tags:
          type: array
          maxItems: 200
          description: Stored tags deleted or merged away since they were chosen, under their stored name — left out of the evaluation and named in the notice (AC-01). They leave the draft at its next audience save
          items: { $ref: "#/components/schemas/AudienceTag" }
    DraftGroupAudience:
      x-delta: added
      type: object
      required: [kind, size]
      additionalProperties: false
      properties:
        kind: { const: group }
        size: { type: integer, minimum: 0, maximum: 10000, description: "`count(broadcast_group_contacts)` of the draft" }
    DraftAudience:
      x-delta: added
      oneOf:
        - { $ref: "#/components/schemas/DraftTagAudience" }
        - { $ref: "#/components/schemas/DraftGroupAudience" }
      discriminator:
        propertyName: kind
        mapping:
          tags: "#/components/schemas/DraftTagAudience"
          group: "#/components/schemas/DraftGroupAudience"
    LaunchedTagAudience:
      x-delta: added
      type: object
      required: [kind, mode, tags]
      additionalProperties: false
      description: The tag audience as it was defined at launch — tag names at launch, rewritten by the launch (data-model assumption 8), never the current names
      properties:
        kind: { const: tags }
        mode: { $ref: "../../contacts/contracts/openapi.yaml#/components/schemas/TagFilterMode" }
        tags:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/AudienceTag" }
    LaunchedGroupAudience:
      x-delta: added
      type: object
      required: [kind]
      additionalProperties: false
      description: A launched broadcast group — its recipients (`listBroadcastRecipients`) are the truth
      properties:
        kind: { const: group }
    LaunchedAudience:
      x-delta: added
      oneOf:
        - { $ref: "#/components/schemas/LaunchedTagAudience" }
        - { $ref: "#/components/schemas/LaunchedGroupAudience" }
      discriminator:
        propertyName: kind
        mapping:
          tags: "#/components/schemas/LaunchedTagAudience"
          group: "#/components/schemas/LaunchedGroupAudience"
    DraftBreakdown:
      x-delta: added
      type: object
      description: The count breakdown (CONTEXT) of a draft, computed on every read for the current Telegram bot by `contacts.audienceBreakdown` (ADR-0004). `audience_size` = `blocked_count` + `never_wrote_count` + `reachable_count`; a contact blocked through that bot counts as blocked even if it never wrote through it (data-model assumption 5)
      required: [audience_size, reach]
      additionalProperties: false
      properties:
        audience_size:
          type: integer
          minimum: 0
          description: Every contact the audience holds or matches, reachable or not. Above 10 000 the draft cannot be launched (AC-05)
        reach:
          description: Null when the workspace has no bot row at all — reach is known once a bot is connected (sad.md §6 assumption)
          anyOf:
            - type: object
              required: [blocked_count, never_wrote_count, reachable_count]
              additionalProperties: false
              properties:
                blocked_count: { type: integer, minimum: 0, description: Blocked the current bot }
                never_wrote_count: { type: integer, minimum: 0, description: Never wrote to the current bot }
                reachable_count: { type: integer, minimum: 0, description: Would reach }
            - { type: "null" }
    LaunchBreakdown:
      x-delta: added
      type: object
      description: The count breakdown a launch confirmation shows, frozen on the broadcast at launch (`broadcasts.audience_size`, `blocked_count`, `never_wrote_count`, `recipient_count`; CHECK they add up)
      required: [audience_size, blocked_count, never_wrote_count, recipient_count]
      additionalProperties: false
      properties:
        audience_size: { type: integer, minimum: 0 }
        blocked_count: { type: integer, minimum: 0 }
        never_wrote_count: { type: integer, minimum: 0 }
