  # ───────────────────────── changed operations ─────────────────────────
  /api/workspaces/{workspaceId}/inbox/conversations/{conversationId}/items:
    parameters:
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/WorkspaceId"
      - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/ConversationId"
    get:
      x-delta: changed
      x-delta-fields: ["response.items[] gains type broadcast"]
      tags: [inbox]
      summary: Read a page of the conversation's history — now with broadcast items (US-07)
      description: |
        Flow 18 (AC-16; ADR-0010). **Changed:** the thread merges a fourth keyset half, broadcast items by
        `broadcast_items.position_at` (`broadcast_items_conversation_position_at_idx`): a delivered item
        sits at the time its delivery was recorded, a not-confirmed one at the time the send was made (its
        claim time). At equal positions the order is message < reply < activity < broadcast. The opaque
        cursor also encodes the kind `broadcast`; a cursor issued before this feature still decodes.

        A broadcast item is never unread, never moves `read_through_at`, never becomes the list row's
        `last_item`, and changes no conversation state (status, assignee, waiting, attention). Only
        delivered and not-confirmed recipients have one (AC-16). The panel shows it apart from replies:
        the text as plain text, "Broadcast «<broadcast_name>» by <launched_by>", the delivered time or
        "not confirmed"; the name links to the broadcast page (SCR-28).

        Parameters and the other answers are unchanged (assignment-statuses `listThreadItems`).
      operationId: listThreadItems
      parameters:
        - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/BackgroundRequest"
        - in: query
          name: before
          required: false
          schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/Cursor" }
        - in: query
          name: after
          required: false
          schema: { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/schemas/Cursor" }
        - $ref: "../../shared-inbox/contracts/openapi.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: One page of the thread, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadPage" }
              example:
                workspace_id: "01920000-0000-7000-8000-000000000001"
                conversation_id: "01920000-0000-7000-8000-0000000000c1"
                items:
                  - type: broadcast
                    id: "01920000-0000-7000-8000-000000000701"
                    workspace_id: "01920000-0000-7000-8000-000000000001"
                    conversation_id: "01920000-0000-7000-8000-0000000000c1"
                    broadcast_id: "01920000-0000-7000-8000-000000000501"
                    broadcast_name: "Test broadcast 1"
                    text: "New prices from Monday."
                    launched_by: { account_id: "01920000-0000-7000-8000-0000000000b1", display_name: "Test User" }
                    state: delivered
                    position_at: "2026-10-23T09:00:01Z"
                  - type: message
                    id: "01920000-0000-7000-8000-0000000000e2"
                    workspace_id: "01920000-0000-7000-8000-000000000001"
                    conversation_id: "01920000-0000-7000-8000-0000000000c1"
                    kind: text
                    body: "Is the VIP price for roses too?"
                    sent_at: "2026-10-23T09:04:00Z"
                    received_at: "2026-10-23T09:04:01Z"
                    edited_at: null
                    attachment: null
                    location: null
                    shared_contact: null
                    poll: null
                has_prev: true
                has_next: false
                prev_cursor: "MjAyNi0xMC0yM1QwOTowMDowMVp8YnwwMTky"
                next_cursor: null
                read_through_at: "2026-10-23T09:04:01Z"
                newest_reply_id: null
        "400": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/ValidationFailed" }
        "401": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../../shared-inbox/contracts/openapi.yaml#/components/responses/AccessRemoved" }
