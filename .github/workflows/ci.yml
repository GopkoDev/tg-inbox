name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r build
      # Integration tests start Postgres via Testcontainers on the runner's Docker.
      - run: pnpm test
      # Browser flows: Playwright starts Postgres (Testcontainers) and serves the built SPA from the API.
      - run: pnpm --filter @tg/web exec playwright install --with-deps chromium
      - run: pnpm --filter @tg/web test:e2e
